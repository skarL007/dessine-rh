name: Dessine RH checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_DB: dessine_rh_test
          POSTGRES_USER: dessine_test
          POSTGRES_PASSWORD: local_ci_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dessine_test -d dessine_rh_test"
          --health-interval 2s
          --health-timeout 4s
          --health-retries 12
    env:
      DESSINE_TEST_POSTGRES_URL: postgres://dessine_test:local_ci_fixture@127.0.0.1:5432/dessine_rh_test
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.22.0
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
